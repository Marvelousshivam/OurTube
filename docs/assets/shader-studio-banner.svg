  <!-- SponsorBlock Timeline Bar Demo -->
  <g transform="translate(36, 120)">
    <text x="0" y="14" class="font-mono" font-size="10.5" font-weight="700" fill="#8CE99A" letter-spacing="1.2">SPONSORBLOCK PRIVACY-PRESERVING SHA-256 TIMELINE SEGMENTS</text>
    <!-- Full Scrubber Track -->
    <rect x="0" y="26" width="1128" height="10" rx="5" fill="#2E2730"/>
    <!-- Played portion -->
    <rect x="0" y="26" width="420" height="10" rx="5" fill="#E9C16C"/>
    <!-- Intro segment (Cyan) -->
    <rect x="65" y="26" width="48" height="10" fill="#00E5FF"/>
    <!-- Sponsor segment (Green) -->
    <rect x="280" y="26" width="95" height="10" fill="#00D400"/>
    <!-- Self Promo (Yellow) -->
    <rect x="560" y="26" width="64" height="10" fill="#FFD600"/>
    <!-- Interaction (Purple) -->
    <rect x="820" y="26" width="52" height="10" fill="#D500F9"/>
    <!-- Outro (Blue) -->
    <rect x="1040" y="26" width="88" height="10" rx="5" fill="#3B82F6"/>

    <!-- Legend Vector Swatches -->
    <rect x="478" y="6" width="8" height="8" rx="2.5" fill="#00E5FF"/>
    <text x="491" y="14" class="font-mono" font-size="10" fill="#00E5FF">Intro</text>
    <rect x="536" y="6" width="8" height="8" rx="2.5" fill="#00D400"/>
    <text x="549" y="14" class="font-mono" font-size="10" fill="#00D400">Sponsor</text>
    <rect x="612" y="6" width="8" height="8" rx="2.5" fill="#FFD600"/>
    <text x="625" y="14" class="font-mono" font-size="10" fill="#FFD600">Self-Promo</text>
    <rect x="706" y="6" width="8" height="8" rx="2.5" fill="#D500F9"/>
    <text x="719" y="14" class="font-mono" font-size="10" fill="#D500F9">Reminder</text>
    <rect x="790" y="6" width="8" height="8" rx="2.5" fill="#3B82F6"/>
    <text x="803" y="14" class="font-mono" font-size="10" fill="#3B82F6">Outro / Credits</text>
    <rect x="912" y="6" width="8" height="8" rx="2.5" fill="#FFB1C8"/>
    <text x="925" y="14" class="font-mono" font-size="10" fill="#FFB1C8">Return YouTube Dislike</text>
  </g>
